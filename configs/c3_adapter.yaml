# Component 3 — Personalized SNN Adapter + Fallback Backbone (owner: Jayarathna P.D.T.M)

backbone_source: primary          # primary (C2 global SNN) | fallback (C3 STDP+SNN)

adapter:
  in_features: 256                # fixed by the interface contract
  hidden_features: 64             # feature compression 256 -> 64
  n_classes: 3
  neuron: lif
  beta_init: 0.9                  # membrane decay (learnable)
  threshold_init: 1.0             # V_th (learnable)
  learn_beta: true
  learn_threshold: true
  surrogate: atan
  threshold_min: 0.1              # V_th floor, applied after every parameter update (M2 decision b)
  # Note: 256*64+64 + 64*3+3 = 16,643 weights + 134 per-neuron β/V_th = 16,777 params ≈ 65 KB fp32.
  # Meeting the ~48 KB profile target needs float16 export (≈ 33 KB) or a smaller hidden size.

training:                         # Milestone 2: supervised adapter training on a frozen backbone
  epochs: 25
  lr: 1.0e-2
  batch_size: 32
  seed: 42
  loss: mse_count                 # snnTorch mse_count_loss (M2 decision a)
  correct_rate: 0.8               # target firing rate of the true class's output neuron
  incorrect_rate: 0.2             # target firing rate of each other output neuron

synthetic:                        # Milestone 2 toy data (no real EEG; see c3_adapter/synthetic.py)
  n_subjects_per_class: 8
  windows_per_subject: 20
  test_subjects_per_class: 2      # held-out subjects per class (split by subject, never by window)
  n_steps: 100
  n_channels: 24
  base_rate: 0.10                 # baseline spike probability per step
  effect: 0.08                    # extra rate in the class's channel group and time segment
  subject_jitter: 0.3             # log-normal spread of per-subject channel gain and signal size
  window_noise: 0.02              # per-window rate noise per channel
  seed: 0

toy_backbone:                     # fixed random LIF reservoir standing in for C2 / fallback
  gain: 2.0
  bias: -0.1
  beta: 0.9
  threshold: 1.0

calibration:
  calibration_fraction: 0.2       # first 20% of the subject's recording
  max_seconds: 120
  max_epochs: 50
  lr: 1.0e-3
  max_trainable_ratio: 0.05       # adapter params / total params

fallback_backbone:
  out_features: 256
  stdp:
    tau_pre_ms: 20.0
    tau_post_ms: 20.0
    a_plus: 0.01
    a_minus: 0.012

export:
  dtype: float16
  encrypt: true                   # AES-256-GCM via the `cryptography` package
  target_size_kb: 48
