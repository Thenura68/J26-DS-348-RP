# Component 1 — EEG-to-Spike Encoding (owner: Rathnayake M.N.M)

encoder:
  # Main encoder (c1_encoding/main_encoder.py), chosen by the encoder comparison:
  #   step_forward = patient-adaptive Step-Forward (main) · tbr = patient-adaptive TBR (baseline)
  # Both use the same patient-adaptive thresholds: theta_c = mean(d_c) + k * std(d_c) of the
  # changes in each patient's first 20%.
  method: step_forward
  k: 2.0                          # selected by scripts/c1_calibrate.py (sweep below); keep in sync
  k_candidates: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0]   # Step-Forward sweep (TBR: calibration.k_candidates)
  baseline_sec: 120               # read by preprocessing (capped at the calibration duration)
  polarity_mode: dual_binary      # contract boundary representation [B, T, 2C]

decoder:
  # Fidelity-check decoder only (the SNN never decodes). A leak matched to the
  # band-pass corner removes the random-walk drift of standard TBR decoding.
  # null = standard non-leaky TBR decoding.
  leak_cutoff_hz: 1.0

calibration:
  include_mean: true              # theta_c = mean(diff_c) + k * std(diff_c), per subject and channel
  k_candidates: [0.05, 0.1, 0.2, 0.3, 0.5, 1.0, 1.5, 2.0, 3.0]
  # median_subject_snr_db: highest median calibration SNR.
  # sparsest_within_snr_tolerance: fewest spikes among k within snr_tolerance_db of the best SNR.
  selection_metric: sparsest_within_snr_tolerance
  snr_tolerance_db: 0.5
  minimum_threshold: 1.0e-6       # same units as the preprocessed EEG
  minimum_signal_std: 1.0e-8
  minimum_derivative_std: 1.0e-8
  report_subject_count: 3
  index_check_subject_count: 2
  output_subdirectory: calibration
  channel_regions:
    anterior_y_min_m: 0.025
    posterior_y_max_m: -0.025

encoding_demo:
  subject_id: "02010002"
  channel_indices: [0, 1, 2]
  overlay_seconds: 5.0
  contiguous_windows_for_overlay: 3

step_forward:
  k_candidates: [0.05, 0.1, 0.2, 0.3, 0.5, 0.75, 1.0]
  minimum_threshold: 1.0e-8
  matched_spike_density: 0.1

bsa:
  # Baseline: Ben's Spiker Algorithm (c1_encoding/bsa.py). Per-subject, per-channel scale
  # from calibration windows only; positive/negative parts encoded separately -> [B, T, 2C].
  scale_percentile: 99.0          # scale_c = 99th percentile of |x| in the calibration windows
  minimum_scale: 1.0e-6
  filter_lengths: [15, 25]        # FIR taps (Hamming-windowed sinc, unit DC gain)
  cutoffs_hz: [20.0, 30.0, 44.0]  # below the 45 Hz band-pass edge
  thresholds: [0.0, 0.05, 0.1, 0.2]
  selection_metric: sparsest_within_snr_tolerance   # same rule as the TBR k sweep
  snr_tolerance_db: 0.5

comparison:
  # scripts/c1_compare_encoders.py: all encoders on the same data. Every method is tuned on
  # calibration windows only with calibration.selection_metric / snr_tolerance_db.
  # step_forward_changes = the main encoder (adaptive SF, theta from std of changes, encoder.k_candidates);
  # step_forward = SF with theta from std of the signal; tbr uses calibration.k_candidates; bsa the bsa: grids.
  output_subdirectory: encoder_comparison
  methods: [step_forward_changes, step_forward_fixed, tbr, aer, step_forward, bsa]
  aer_thresholds: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.75, 1.0]  # one fixed theta for all
  step_forward_fixed_thresholds: [0.1, 0.2, 0.3, 0.35, 0.4, 0.5, 0.6, 0.8, 1.0]  # SF with one theta for all
  step_forward_k: [0.05, 0.1, 0.2, 0.3, 0.5, 0.75, 1.0, 1.5]              # theta_c = k_sf * std(x)
  matched_density_targets: [0.15, 0.30]   # also compare every method at these spike densities
  decision:                               # fixed before running (pre-registered)
    density_target: 0.30                  # compare methods at this matched density
    feature_rho_tie_margin: 0.02          # within this of the best feature Spearman = tied
                                          # ties -> lowest ops/sample -> lowest density CV -> highest SNR

calibration_length:
  # scripts/c1_calibration_length.py: how many seconds of calibration TBR needs.
  # Uses the first N clean calibration windows (2 s each, chronological); k fixed at 1.0.
  output_subdirectory: calibration_length
  seconds: [10, 20, 30, 45, 60]
  k: 1.0
  convergence:                    # "converged" = first length meeting both conditions
    max_median_theta_change: 0.05 # median |theta_L - theta_full| / theta_full across subjects
    max_snr_drop_db: 0.1          # evaluation SNR within this of the full-calibration SNR

dashboard:
  # scripts/c1_dashboard_figures.py: explanatory figures for the Frontend C1 page.
  output_subdirectory: dashboard
  subject_id: "02010002"          # patient shown in the split and step figures
  comparison_subject_id: "02020008"   # second patient for the adaptation comparison
  channel: E1
  zoom_seconds: 1.0               # length of the step-by-step close-up

diagnostics:
  subject_count: 5
  mdd_subject_count: 3
  hc_subject_count: 2
  samples_per_position_region: 50
  error_plot_window_count: 3
  error_plot_channel_index: 0
  reanchoring_intervals: [50, 100]
  side_information_bits_per_sample: 32
  sine:
    sampling_rate_hz: 250.0
    frequency_hz: 10.0
    amplitude: 1.0
    duration_sec: 2.0
    threshold: 0.001
  unnormalized_variant_subdirectory: modma_preprocessed_unnormalized

fidelity:
  # Encode -> decode -> compare on every subject's EVALUATION windows (thresholds
  # from calibration profiles). Waveform metrics plus depression-relevant features.
  output_subdirectory: fidelity
  welch_segment_sec: 1.0          # 1 Hz PSD resolution, 50% overlap inside each 2 s window
  bands:                          # [low, high) Hz, within the 0.5-45 Hz band-pass
    delta: [0.5, 4.0]
    theta: [4.0, 8.0]
    alpha: [8.0, 13.0]
    beta: [13.0, 30.0]
    gamma: [30.0, 45.0]
  asymmetry_pairs:                # [left, right]: HydroCel electrodes nearest the 10-20 sites
    F3_F4: [E24, E124]
    F7_F8: [E33, E122]
  thresholds:                     # null = report only; set after reviewing the cohort report
    min_correlation: null
    max_band_power_abs_error_db: null
  classifier:                     # sanity check only: logistic regression, 3 classes, shared folds.json
    regularization_c: 1.0
    max_iter: 2000

preprocessing:
  # Fixed in code (data/preprocessing.py → prepare_subject_windows), not configurable:
  # row 129 (Cz/E129) is dropped, bad channels are interpolated (never removed), CAR over
  # E1-E128, no ICA (MODMA has no EOG channels). Split fraction: common.yaml → split.
  montage: GSN-HydroCel-128
  channels_to_drop: []            # must stay empty: all 128 scalp channels are kept
  detrend: linear
  filter_padding_sec: 2.0
  notch:
    enabled: true
    frequency_hz: 50.0
    quality_factor: 30.0
  artifact:
    flat_std_threshold: 1.0e-12   # bad-channel detection, calibration only
    max_std_ratio: 10.0
    variance_mad_multiplier: 10.0
    peak_to_peak_mad_multiplier: 10.0   # window rejection limit fitted on calibration windows
  amplitude_scaling:
    method: zscore                # calibration-only; use microvolts only with verified conversion metadata
    epsilon: 1.0e-8
  channel_selection:
    keep_names: null              # null = all E1-E128 (the only accepted setting)
