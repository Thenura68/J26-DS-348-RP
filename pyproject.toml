[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snn-depression"
version = "0.1.0"
description = "Patient-adaptive EEG depression severity classification with Spiking Neural Networks (SLIIT J26-DS-348)"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"

[tool.ruff]
line-length = 100
target-version = "py310"
